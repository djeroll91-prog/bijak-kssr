<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6bff"/>
      <stop offset="0.55" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#25c9b0"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="1" stop-color="#ffb02e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- softened glow behind star -->
  <circle cx="256" cy="268" r="188" fill="#ffffff" opacity="0.10"/>

  <!-- sparkles -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M96 128 l14 30 30 14 -30 14 -14 30 -14 -30 -30 -14 30 -14z"/>
    <path d="M416 118 l10 22 22 10 -22 10 -10 22 -10 -22 -22 -10 22 -10z"/>
    <path d="M420 352 l8 18 18 8 -18 8 -8 18 -8 -18 -18 -8 18 -8z"/>
    <circle cx="104" cy="356" r="9"/>
    <circle cx="150" cy="96" r="7"/>
  </g>

  <!-- star mascot -->
  <path
    d="M256 92 L303 197 L418 210 L332 287 L356 400 L256 342 L156 400 L180 287 L94 210 L209 197 Z"
    fill="url(#star)" stroke="url(#star)" stroke-width="22" stroke-linejoin="round"
    filter="url(#soft)"/>

  <!-- face -->
  <g>
    <ellipse cx="196" cy="278" rx="20" ry="13" fill="#ff7aa2" opacity="0.55"/>
    <ellipse cx="316" cy="278" rx="20" ry="13" fill="#ff7aa2" opacity="0.55"/>
    <circle cx="213" cy="242" r="15" fill="#4a3b2a"/>
    <circle cx="299" cy="242" r="15" fill="#4a3b2a"/>
    <circle cx="218" cy="237" r="5" fill="#ffffff"/>
    <circle cx="304" cy="237" r="5" fill="#ffffff"/>
    <path d="M222 286 Q256 320 290 286" fill="none" stroke="#4a3b2a"
      stroke-width="13" stroke-linecap="round"/>
  </g>
</svg>
